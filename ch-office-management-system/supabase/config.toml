# Supabase Local Development & Deployment Configuration
# Project: CH Office Management System
# Business: CH Composing E-Stamp & Tax Advisor, Chamber No. 121, Kachahri Sahiwal

project_id = "ch-office-management"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://*"]
jwt_expiry = 3600
enable_signup = true

[storage]
enabled = true
file_size_limit = "50MiB"

[edge_runtime]
enabled = true
port = 54324
